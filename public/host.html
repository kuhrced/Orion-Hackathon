<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race game: big screen</title>
<!-- The fonts load in the background: a phone with no internet on this Wi-Fi must not wait for them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/style.css">
</head>
<body class="host">
<main id="stage">
  <canvas id="draw"></canvas>
  <canvas id="game" hidden></canvas>
  <div id="hint"></div>
  <div id="caption" hidden></div>
  <div id="overlay">
    <div id="count" hidden></div>
    <div id="ranking" aria-live="polite" hidden></div>
    <div id="quiz" class="quiz" hidden>
      <div class="quiz-top"><span id="quizNumber"></span><span id="quizCount"></span></div>
      <h2 id="quizText"></h2>
      <ol id="quizChoices" class="choices" hidden></ol>
      <ol id="quizWho" hidden></ol>
      <ol id="quizRows"></ol>
      <div class="timer"><div id="quizTimer"></div></div>
    </div>
    <div id="results" hidden>
      <h2>Results</h2>
      <p id="realWinner"></p>
      <ol id="resultList"></ol>
    </div>
  </div>
</main>
<aside id="side">
  <section id="joinBox">
    <img id="qr" alt="QR code to join the game">
    <div class="label" id="scanLabel">Scan to join</div>
    <div id="code">····</div>
    <div id="joinUrl"></div>
  </section>
  <section class="list">
    <div class="label" id="listTitle">Players</div>
    <ol id="players"></ol>
  </section>
  <section id="actions">
    <div id="clock" hidden></div>
    <form id="topicRow" class="option" hidden>
      <span class="label">Topic</span>
      <div><input id="topic" maxlength="60" autocomplete="off" aria-label="What the questions are about"><button type="submit">Set</button></div>
    </form>
    <div id="sourceRow" class="row" hidden>
      <label id="pdfButton" class="button">Upload a PDF<input id="pdf" type="file" accept="application/pdf" hidden></label>
      <button id="teacher" type="button">Teacher screen</button>
    </div>
    <p id="bankNote" hidden></p>
    <div id="modeRow" class="option" hidden><span class="label">Mode</span><div><button id="soloMode" type="button">Solo</button><button id="teamMode" type="button">Team</button></div></div>
    <div id="worldRow" class="option" hidden>
      <span class="label">World</span>
      <div><span id="worldName"></span><button id="worldNext" type="button">Change</button></div>
    </div>
    <div id="lapsRow" class="option" hidden>
      <span class="label" id="lapsLabel">Laps</span>
      <div><button id="lapsDown" type="button" aria-label="Fewer laps">−</button><span id="laps">1</span><button id="lapsUp" type="button" aria-label="More laps">+</button></div>
    </div>
    <button id="main" class="primary" type="button"></button>
    <button id="second" type="button"></button>
    <div class="row" id="botRow">
      <button id="voiceToggle" type="button"></button>
      <button id="addBot" type="button">Add bot</button>
      <button id="removeBot" type="button">Remove bot</button>
    </div>
  </section>
</aside>
<script type="module" src="/host.js"></script>
</body>
</html>
