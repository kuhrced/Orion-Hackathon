<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race game: big screen</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="host">
<main id="stage">
  <canvas id="draw"></canvas>
  <canvas id="game" hidden></canvas>
  <div id="hint"></div>
  <div id="overlay">
    <div id="count" hidden></div>
    <div id="quiz" class="quiz" hidden>
      <div class="quiz-top"><span id="quizNumber"></span><span id="quizCount"></span></div>
      <h2 id="quizText"></h2>
      <ol id="quizRows"></ol>
      <div class="timer"><div id="quizTimer"></div></div>
    </div>
    <div id="results" hidden>
      <h2>Results</h2>
      <p id="realWinner"></p>
      <ol id="resultList"></ol>
      <p id="greenResult"></p>
    </div>
  </div>
</main>
<aside id="side">
  <section id="joinBox">
    <img id="qr" alt="QR code to join the game">
    <div class="label">Join at</div>
    <div id="joinUrl"></div>
    <div class="label">Game code</div>
    <div id="code">····</div>
  </section>
  <section id="greenBox" hidden>
    <div class="label">How healthy is the map <span id="greenValue">0%</span></div>
    <div class="meter"><div id="greenBar"></div></div>
  </section>
  <section>
    <div class="label" id="listTitle">Players</div>
    <ol id="players"></ol>
  </section>
  <section id="actions">
    <div id="clock" hidden></div>
    <form id="topicRow" class="option" hidden>
      <span class="label">Topic</span>
      <div><input id="topic" maxlength="60" autocomplete="off" aria-label="What the questions are about"><button type="submit">Set</button></div>
    </form>
    <p id="bankNote" hidden></p>
    <div id="worldRow" class="option" hidden>
      <span class="label">World</span>
      <div><span id="worldName"></span><button id="worldNext" type="button">Change</button></div>
    </div>
    <div id="lapsRow" class="option" hidden>
      <span class="label">Laps</span>
      <div><button id="lapsDown" type="button" aria-label="Fewer laps">−</button><span id="laps">2</span><button id="lapsUp" type="button" aria-label="More laps">+</button></div>
    </div>
    <button id="main" class="primary" type="button"></button>
    <button id="second" type="button"></button>
    <div class="row" id="botRow">
      <button id="addBot" type="button">Add bot</button>
      <button id="removeBot" type="button">Remove bot</button>
    </div>
  </section>
</aside>
<script type="module" src="/host.js"></script>
</body>
</html>
