<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17191c">
<title>Race game</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="phone" data-screen="join">

<form class="screen card" id="join">
  <h1>Join the race</h1>
  <label>Game code
    <input id="codeInput" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
  </label>
  <label>Your name
    <input id="nameInput" maxlength="14" autocomplete="off" required>
  </label>
  <button class="primary" type="submit">Join</button>
  <p id="joinError" role="alert"></p>
</form>

<section class="screen card" id="lobby">
  <h1 id="hello"></h1>
  <div id="myCar"></div>
  <button id="changeCar" type="button">Change car</button>
  <p id="status"></p>
</section>

<section class="screen" id="race">
  <canvas id="view"></canvas>
  <div id="hud">
    <div id="place"></div>
    <div id="lap"></div>
  </div>
  <div id="banner"></div>
  <div id="pedals">
    <button id="left" type="button" aria-label="Steer left">◀</button>
    <button id="right" type="button" aria-label="Steer right">▶</button>
  </div>
</section>

<section class="screen" id="done">
  <div class="label">You finished</div>
  <div class="big" id="myPlace"></div>
  <ol id="doneList"></ol>
  <p id="doneNote">Look at the big screen for the next race.</p>
</section>

<script type="module" src="/play.js"></script>
</body>
</html>
